<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="heading">
        <h1>My Image Gallery</h1>
        <p>A simple collection of beautiful places</p>
    </header>

    <main class="container">
        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="nature">Nature</button>
            <button class="filter-btn" data-category="city">City</button>
            <button class="filter-btn" data-category="travel">Travel</button>
        </div>

        <section class="gallery" id="gallery">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Mountain lake" data-category="nature">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800" alt="City buildings" data-category="city">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Mountain view" data-category="travel">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Green forest" data-category="nature">
            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800" alt="City at night" data-category="city">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" alt="Snow mountains" data-category="travel">
        </section>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="close" id="closeBtn" aria-label="Close">&times;</button>
        <button class="navigation prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
        <img id="lightboxImage" src="" alt="Selected image">
        <button class="navigation next" id="nextBtn" aria-label="Next image">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
